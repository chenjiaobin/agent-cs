# 第 1 篇只起 Postgres + pgvector，验证"向量能力可用"。
# 本机没装 Docker 的话，用下面的云库替代方案，别在这里卡住。
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agent_cs_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_cs
    ports:
      - "5432:5432"
    volumes:
      - agent_cs_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_cs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agent_cs_pgdata:
